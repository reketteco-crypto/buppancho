services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build:
      target: deps
    command: ["pnpm", "dev", "--hostname", "0.0.0.0"]
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      # ホスト側のpnpm buildと開発サーバーの成果物が混在しないよう分離する。
      - dev_next:/app/.next

volumes:
  dev_node_modules:
  dev_next:
